<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nimble — self-hosted website builder</title>
  <meta name="description" content="Nimble is a simple, self-hosted drag-and-drop website builder.">
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17172b;background:#f7f7fb}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(760px,100%);background:#fff;border:1px solid #e8e8ef;border-radius:28px;padding:clamp(30px,7vw,70px);box-shadow:0 24px 70px rgba(28,24,77,.1)}
    .brand{display:flex;align-items:center;gap:10px;font-weight:850;font-size:20px;letter-spacing:-.05em}.mark{width:38px;height:38px;border-radius:12px;background:#17172b;color:#fff;display:grid;place-items:center;font-size:17px}
    .label{font-size:12px;color:#77768a;font-weight:600;margin-left:4px;padding-left:12px;border-left:1px solid #e8e8ef}
    h1{font-size:clamp(42px,8vw,76px);line-height:.96;letter-spacing:-.08em;max-width:620px;margin:72px 0 20px}p{color:#77768a;line-height:1.65;max-width:560px;margin:0 0 28px}
    .actions{display:flex;gap:10px;flex-wrap:wrap}.button{display:inline-block;border-radius:11px;padding:12px 16px;text-decoration:none;font-size:13px;font-weight:800;border:1px solid #e8e8ef;color:#17172b}.primary{background:#6957ff;color:#fff;border-color:#6957ff}
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="mark">n.</span><span>nimble</span><span class="label">Website builder</span></div>
    <h1>Build a site without wrestling with code.</h1>
    <p>Nimble gives your team a calm visual editor for pages, templates, images, videos, forms, publishing, and access management. Run it locally, on Docker, or on ordinary PHP/MySQL shared hosting.</p>
    <div class="actions"><a class="button primary" href="/login.html">Open builder</a><a class="button" href="https://github.com/HakonHakon/Nimble">View source on GitHub</a></div>
  </main>
</body>
</html>

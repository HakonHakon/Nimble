<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parsen</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif}.page{min-height:100vh;padding:34px 7vw 70px}.nav{display:flex;gap:12px;margin-bottom:26px}.nav a{display:flex;width:42px;height:42px;border:1px solid #111;border-radius:50%;align-items:center;justify-content:center;color:#111;text-decoration:none;font-size:20px}.brand{display:block;width:220px;margin:0 auto 46px;text-align:center}.brand img{width:100%;display:block}.content{max-width:980px;margin:0 auto}.content h1{font-size:clamp(38px,6vw,72px);line-height:1;margin:0 0 28px;font-weight:400;letter-spacing:-.04em}.content h2{font-size:clamp(25px,3vw,40px);line-height:1.05;margin:44px 0 12px;font-weight:400;letter-spacing:-.03em}.content p{font-size:18px;line-height:1.55;max-width:760px;margin:0 0 18px}.intro{font-size:clamp(22px,3vw,34px)!important;line-height:1.25!important;max-width:850px!important;margin-bottom:42px!important}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;margin-top:34px}.card{border-top:1px solid #111;padding-top:18px}.card h2{margin:0 0 12px;font-size:30px}.card p{font-size:17px}.link{color:#111;text-decoration:underline;text-underline-offset:4px}.form{max-width:720px;margin-top:34px}.form label{display:block;font-size:16px;margin:18px 0 7px}.form input,.form textarea{width:100%;border:1px solid #111;border-radius:0;padding:12px;font:inherit;background:#fff}.form textarea{min-height:150px}.form button{margin-top:24px;border:1px solid #111;background:#111;color:#fff;padding:13px 22px;font:inherit}@media(max-width:700px){.page{padding:24px 22px 50px}.brand{width:180px;margin-bottom:34px}.grid{grid-template-columns:1fr}.content p{font-size:17px}}
</style></head>
<body><div class="page"><nav class="nav"><a href="/" aria-label="Hjem">⌂</a><a href="/om-oss/" aria-label="Om oss">i</a><a href="/kontakt-oss/" aria-label="Kontakt oss">✉</a></nav><a class="brand" href="/"><img src="https://parsen.no/wp-content/themes/parsen/assets/images/parsen-logo.jpg" alt="Parsen"></a><main id="app" class="content"></main></div>
<script>
const data={
home:`<div class="grid" style="margin-top:0"><a class="card" href="/parsen-design/"><img src="https://parsen.no/wp-content/themes/parsen/assets/images/compass.jpg" alt="Parsen Design" style="width:100%;max-width:280px"><h2>Parsen Design</h2></a><a class="card" href="/parsen-bygg/"><img src="https://parsen.no/wp-content/themes/parsen/assets/images/hand-plane.jpg" alt="Parsen Bygg" style="width:100%;max-width:280px"><h2>Parsen Bygg</h2></a></div>`,
about:`<h1>Om oss</h1><p class="intro">Parsen kombinerer produktdesign og praktisk byggekompetanse. Vi hjelper privatpersoner og bedrifter fra den første ideen til en gjennomført løsning.</p><div class="grid"><section class="card"><h2>Parsen Design</h2><p>Vi utvikler produkter med fokus på funksjon, produksjon og materialvalg. Arbeidet kan omfatte 3D-modellering, 2D-tegninger, prototyper og tilrettelegging for produksjon.</p></section><section class="card"><h2>Parsen Bygg</h2><p>Vi utfører små og store oppdrag innen oppussing og bygg, blant annet tilpasset innredning, gulv, vinduer, kjøkkenmontering, maling og rådgiving.</p></section></div><section class="card" style="margin-top:42px"><h2>Slik jobber vi</h2><p>God dialog, tydelige avtaler og løsninger som passer behovet ditt står i sentrum. Ta kontakt for å fortelle oss om prosjektet ditt.</p><p><a class="link" href="/kontakt-oss/">Kontakt oss</a></p></section>`,
contact:`<h1>Kontakt oss</h1><p class="intro">Har du et designprosjekt, et byggeoppdrag eller behov for rådgiving? Send oss en melding, så tar vi kontakt.</p><form class="form" action="mailto:parisa.ebadat@yahoo.com" method="post" enctype="text/plain"><label>Nettside</label><input name="website"><label>Navn *</label><input name="name" required><label>E-post *</label><input name="email" type="email" required><label>Telefon</label><input name="phone"><label>Emne</label><input name="subject"><label>Melding *</label><textarea name="message" required></textarea><p style="font-size:14px">Felter merket med * må fylles ut.</p><button>Send melding</button></form>`,
design:`<h1>Parsen Design</h1><p class="intro">Trenger du et nytt produkt eller vil du oppgradere produktene som har vært i produksjon i en stund? Parsen har erfaring i industridesign og utvikling av produkter som krever kreative løsninger.</p><div class="grid"><section class="card"><h2>Produktdesign</h2><p>Fra idé og skisser til 3D-modellering, prototyper og produksjonsunderlag.</p></section><section class="card"><h2>Embelasjedesign</h2><p>Helhetlige emballasjeløsninger med fokus på funksjon, uttrykk og produksjon.</p></section><section class="card"><h2>Møbeldesign</h2><p>Gjennomtenkte møbler og innredning tilpasset rom, materialer og bruk.</p></section><section class="card"><h2>Bildet</h2><p>Visuelle løsninger og detaljer som gjør produktet tydelig og gjennomført.</p></section></div><p style="margin-top:44px"><a class="link" href="/kontakt-oss/">Start et designprosjekt</a></p>`,
build:`<h1>Parsen Bygg</h1><p class="intro">Lei av oppussing? Parsen har erfaring i små og stor oppdrager.</p><div class="grid"><section class="card"><h2>Tilpasset innredning</h2><p>Praktiske løsninger bygget for rommet og behovet ditt.</p></section><section class="card"><h2>Bytte vindu</h2><p>Rådgiving og utførelse ved utskifting av vinduer.</p></section><section class="card"><h2>Bytte gulv</h2><p>Gulvlegging med ryddig gjennomføring og gode materialvalg.</p></section><section class="card"><h2>Bygge veranda/ platting</h2><p>Solide uteområder tilpasset huset og tomten.</p></section><section class="card"><h2>Kjøkkenmontering</h2><p>Nøyaktig montering og tilpasning av kjøkken.</p></section><section class="card"><h2>Maling</h2><p>Overflatearbeid som gir rommene et nytt uttrykk.</p></section><section class="card"><h2>Rådgiving</h2><p>Praktiske råd fra idé til ferdig prosjekt.</p></section><section class="card"><h2>Bildet</h2><p>Dokumentasjon og visuelle løsninger fra byggeprosjekter.</p></section></div><p style="margin-top:44px"><a class="link" href="/kontakt-oss/">Ta kontakt om et byggeoppdrag</a></p>`};
const path=location.pathname.replace(/\/+$/,'')||'/';const key=path==='/'?'home':path==='/om-oss'?'about':path==='/kontakt-oss'?'contact':path==='/parsen-design'?'design':path==='/parsen-bygg'?'build':'home';document.title=key==='home'?'Parsen':key==='about'?'Om oss':key==='contact'?'Kontakt oss':key==='design'?'Parsen Design':'Parsen Bygg';document.getElementById('app').innerHTML=data[key];
</script></body></html>

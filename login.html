<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in — Nimble</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#1c1c32;color:#fff;font-family:Inter,system-ui,sans-serif;display:grid;place-items:center;padding:24px}.card{width:min(430px,100%);background:#fff;color:#17172b;border-radius:24px;padding:32px;box-shadow:0 26px 80px rgba(0,0,0,.25)}.brand{display:flex;align-items:center;gap:10px;margin-bottom:35px}.mark{width:36px;height:36px;border-radius:11px;background:#17172b;color:#fff;display:grid;place-items:center;font-weight:850}.word{font-size:20px;font-weight:850;letter-spacing:-.06em}.label{color:#77768a;font-size:12px;padding-left:10px;border-left:1px solid #e7e7ee}h1{font-size:30px;letter-spacing:-.07em;margin:0 0 8px}p{color:#77768a;font-size:13px;line-height:1.5;margin:0 0 25px}.field{margin:0 0 15px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:7px}.field input{width:100%;padding:12px;border:1px solid #e4e3eb;border-radius:10px;font:inherit;outline:none}.field input:focus{border-color:#6957ff;box-shadow:0 0 0 3px #eeecff}.submit{width:100%;padding:13px;border:0;border-radius:10px;background:#6957ff;color:#fff;font-weight:800;cursor:pointer;margin-top:4px}.submit:hover{background:#4e3fe1}.message{min-height:20px;color:#b54747;font-size:12px;margin-top:14px}.note{font-size:11px;color:#9a98a7;margin-top:22px;text-align:center}.hidden{display:none!important}.setup-hint{background:#f4f2ff;color:#5c54a9;border-radius:11px;padding:11px;font-size:12px;line-height:1.45;margin-bottom:17px}</style>
</head>
<body><main class="card"><div class="brand"><div class="mark">n.</div><div class="word">nimble</div><div class="label">Builder</div></div><h1 id="title">Sign in to your site</h1><p id="subtitle">Manage pages, media, templates and publishing from one calm control panel.</p><div id="setupHint" class="setup-hint hidden">This is the first run. Create the owner account for this Nimble site.</div><form id="authForm"><div id="nameField" class="field hidden"><label for="name">Your name</label><input id="name" autocomplete="name"></div><div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" minlength="12" required></div><button class="submit" id="submit">Sign in</button><div class="message" id="message"></div></form><div class="note">Nimble · secure access for your team</div></main>
<script type="module" src="/assets/login.js"></script>
</body></html>

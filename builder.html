<link rel="stylesheet" href="/assets/public.css">
<style>
:root{--ink:#17172b;--muted:#77768a;--line:#e8e8ef;--soft:#f7f7fb;--purple:#6957ff;--purple-dark:#4e3fe1;--mint:#d9f6ed;--shadow:0 16px 38px rgba(28,24,77,.09)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:#f3f3f7}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}a{color:inherit}
.app{min-height:100vh;display:grid;grid-template-rows:68px 1fr}.topbar{display:flex;align-items:center;gap:22px;background:#fff;border-bottom:1px solid var(--line);padding:0 20px;z-index:10}.brand{display:flex;align-items:center;gap:10px;min-width:210px}.brand-mark{width:32px;height:32px;border-radius:10px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:850;font-size:16px;letter-spacing:-.08em}.brand-word{font-weight:800;letter-spacing:-.04em;font-size:19px}.brand-label{font-size:12px;color:var(--muted);padding-left:10px;border-left:1px solid var(--line)}.top-actions{display:flex;align-items:center;gap:9px;margin-left:auto}.save-state{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:7px;margin-right:8px}.save-dot{width:7px;height:7px;border-radius:99px;background:#45bd83}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 14px;border-radius:11px;font-weight:700;font-size:13px;transition:.18s ease}.btn:hover{border-color:#c7c5d8;transform:translateY(-1px)}.btn-primary{color:#fff;background:var(--purple);border-color:var(--purple)}.btn-primary:hover{background:var(--purple-dark);border-color:var(--purple-dark)}.btn-icon{width:37px;height:37px;padding:0;display:grid;place-items:center}.avatar{width:34px;height:34px;border-radius:50%;background:#f0c5a1;display:grid;place-items:center;font-size:12px;font-weight:800;color:#65391d;margin-left:3px}
.workspace{display:grid;grid-template-columns:72px 260px minmax(500px,1fr) 292px;min-height:0}.rail{background:#1c1c32;color:#aaa9bc;display:flex;flex-direction:column;align-items:center;padding:18px 0;gap:8px}.rail-button{width:54px;height:55px;border-radius:15px;color:#a9a8bd;background:transparent;display:flex;flex-direction:column;gap:5px;align-items:center;justify-content:center;font-size:10px}.rail-button:hover{color:#fff;background:#2b2b47}.rail-button.active{color:#fff;background:#6a59ff;box-shadow:0 8px 18px rgba(105,87,255,.3)}.rail-spacer{flex:1}.panel{background:#fff;border-right:1px solid var(--line);min-height:0;overflow:auto}.left-panel{padding:21px 16px}.panel-title{font-size:16px;font-weight:800;letter-spacing:-.03em;margin:0}.panel-subtitle{font-size:12px;color:var(--muted);margin:5px 0 18px}.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.section-label{font-size:10px;font-weight:800;color:#a09eaf;text-transform:uppercase;letter-spacing:.12em;margin:21px 0 9px}.component-list{display:grid;grid-template-columns:1fr 1fr;gap:9px}.component{display:flex;align-items:center;gap:8px;padding:11px 10px;border:1px solid var(--line);border-radius:12px;background:var(--soft);font-size:12px;font-weight:750;color:#3e3d50;cursor:grab}.component:hover{border-color:#bdb8ff;background:#f0efff}.component strong{font-size:15px;color:var(--purple)}.tip{margin-top:20px;border-radius:14px;padding:13px;background:#fff8d8;font-size:12px;line-height:1.45;color:#6e5e20}.tip strong{display:block;color:#473a04;margin-bottom:3px}.page-list{display:grid;gap:7px}.page-item{display:flex;align-items:center;gap:9px;padding:11px;border:1px solid transparent;border-radius:11px;font-size:13px;cursor:pointer}.page-item:hover{background:var(--soft)}.page-item.active{background:#f0efff;border-color:#ddd9ff;color:var(--purple-dark);font-weight:800}.page-actions{margin-left:auto;opacity:0}.page-item:hover .page-actions,.page-item.active .page-act .canvas-area{min-width:0;background:#f4f4f8;display:flex;flex-direction:column}.canvas-toolbar{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 19px;border-bottom:1px solid var(--line);background:#fafafd}.crumbs{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}.crumbs strong{color:var(--ink);font-size:13px}.canvas-tools{display:flex;align-items:center;gap:6px}.device-switch{background:#fff;border:1px solid var(--line);border-radius:9px;padding:6px;display:flex;gap:3px}.device-switch button{background:transparent;border-radius:6px;width:29px;height:25px;color:#8c8a9b}.device-switch button.active{background:#f0efff;color:var(--purple)}.canvas-scroll{overflow:auto;padding:30px 38px 60px;flex:1}.site-canvas{max-width:980px;margin:0 auto;background:#fff;min-height:730px;border-radius:13px;box-shadow:var(--shadow);overflow:hidden;transition:max-width .2s}.site-canvas.tablet{max-width:720px}.site-canvas.mobile{max-width:390px}.site-nav{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 38px;border-bottom:1px solid #ededf1;background:#fff}.site-logo{font-weight:850;letter-spacing:-.06em;font-size:20px}.site-links{display:flex;gap:25px;font-size:12px;color:#555466}.site-links a{text-decoration:none}.site-links a:hover{text-decoration:underline}.canvas-block{position:relative;border:2px solid transparent;transition:.14s ease;cursor:pointer}.canvas-block:hover{border-color:#c8c3ff}.canvas-block.selected{border-color:var(--purple)}.block-label{position:absolute;top:-24px;left:-2px;background:var(--purple);color:#fff;padding:4px 8px;border-radius:6px 6px 0 0;font-size:10px;font-weight:800;opacity:0;pointer-events:none;z-index:2}.canvas-block.selected .block-label{opacity:1}.block-hint{position:absolute;right:8px;top:8px;background:#fff;border:1px solid var(--line);border-radius:7px;padding:4px 6px;font-size:9px;color:var(--muted);opacity:0}.canvas-block:hover .block-hint{opacity:1}.hero-block{min-height:340px;display:grid;grid-template-columns:1.12fr .88fr;background:linear-gradient(125deg,#fffaf1,#f3edff);padding:44px}.hero-copy{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding-right:28px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.15em;font-weight:850;color:var(--purple);margin-bottom:15px}.hero-block h1{font-size:clamp(32px,4.3vw,57px);line-height:.97;letter-spacing:-.07em;margin:0 0 18px;max-width:480px}.hero-block p{font-size:16px;line-height:1.55;color:#676579;max-width:410px;margin:0 0 22px}.hero-button{padding:12px 17px;border-radius:9px;background:var(--ink);color:#fff;text-decoration:none;font-weight:750;font-size:12px}.hero-art{margin:auto;width:220px;height:220px;border-radius:38% 62% 58% 42%/43% 40% 60% 57%;background:linear-gradient(145deg,#a0f1de,#8572ff);position:relative;box-shadow:16px 18px 0 rgba(28,25,77,.09)}.hero-art:before{content:"";position:absolute;width:115px;height:115px;border-radius:50%;background:#fff0b0;top:25px;left:35px}.hero-art:after{content:"✦";position:absolute;color:#fff;font-size:73px;right:20px;bottom:18px;transform:rotate(16deg)}.services-block{padding:42px}.section-heading{display:flex;justify-content:space-between;align-items:end;margin-bottom:24px}.section-heading h2{margin:0;font-size:28px;letter-spacing:-.06em}.section-heading p{font-size:12px;color:var(--muted);max-width:250px;line-height:1.4;margin:0}.card-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.service-card{background:#fafafa;border:1px solid #ebebef;border-radius:14px;padding:20px;min-height:150px}.service-icon{width:30px;height:30px;border-radius:9px;background:#ece8ff;color:var(--purple);display:grid;place-items:center;margin-bottom:17px}.service-card h3{font-size:14px;margin:0 0 8px}.service-card p{font-size:12px;color:var(--muted);line-height:1.5;margin:0}.split-block{display:grid;grid-template-columns:.92fr 1.08fr;min-height:275px;background:#1d1d33;color:#fff}.split-image{background:center/cover;min-height:245px}.split-copy{padding:42px 44px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start}.split-copy h2{font-size:30px;line-height:1;letter-spacing:-.07em;margin:0 0 12px}.split-copy p{font-size:13px;line-height:1.55;color:#b9b8ca;max-width:340px;margin:0 0 18px}.light-link{color:#fff;font-size:12px;font-weight:750}.video-block{padding:32px 42px;background:#fff8ed}.video-frame{height:205px;border-radius:15px;background-position:center;background-size:cover;display:grid;place-items:center;color:#fff}.play{width:53px;height:53px;border-radius:50%;background:#fff;color:var(--ink);display:grid;place-items:center;padding-left:3px;box-shadow:0 9px 20px rgba(0,0,0,.18)}.video-block h2{margin:15px 0 5px;font-size:20px;letter-spacing:-.04em}.video-block p{margin:0;font-size:12px;color:var(--muted)}.cta-block{padding:43px;background:var(--mint);display:flex;justify-content:space-between;align-items:center}.cta-block h2{font-size:28px;letter-spacing:-.06em;margin:0}.cta-block p{font-size:12px;color:#5b756e;margin:6px 0 0}.add-section{display:flex;align-items:center;justify-content:center;padding:15px;color:var(--purple);font-size:12px;font-weight:750;border:1px dashed #c7c2ff;background:#fafaff;margin:14px 38px;border-radius:10px}.drop-zone{height:7px;margin:0 38px;border:1px dashed transparent}.drop-zone.drag-over{height:35px;padding:10px;border-color:#c7c2ff;color:var(--purple);font-size:10px;text-align:center}
.inspector{background:#fff;min-height:0;overflow:auto;border-left:1px solid var(--line);padding:21px 18px}.inspector-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.inspector-title{font-size:16px;font-weight:800;letter-spacing:-.03em}.inspector-section{padding:17px 0;border-top:1px solid var(--line)}.inspector-section:first-of-type{border-top:0;padding-top:0}.field{margin-bottom:14px}.field:last-child{margin-bottom:0}.field label{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:800;color:#4d4b5f;margin-bottom:7px}.field label span{font-size:10px;font-weight:500;color:#aaa8b6}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 11px;background:#fff;color:var(--ink);outline:none;font-size:12px}.field input:focus,.field textarea:focus,.field select:focus{border-color:#a59bff;box-shadow:0 0 0 3px #eeecff}.field textarea{resize:vertical;min-height:76px;line-height:1.45}.color-row{display:flex;gap:8px;flex-wrap:wrap}.color-dot{width:29px;height:29px;border-radius:8px;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer}.color-dot.active{box-shadow:0 0 0 2px var(--purple)}.empty-inspector{color:var(--muted);font-size:12px;line-height:1.55;background:#fafafa;padding:18px;border-radius:12px}
.modal-layer{position:fixed;inset:0;background:rgba(25,24,43,.34);backdrop-filter:blur(5px);display:grid;place-items:center;z-index:50;padding:25px}.modal{width:min(850px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:22px;box-shadow:0 25px 70px rgba(22,17,72,.25);padding:26px}.modal-top{display:flex;justify-content:space-between;align-items:start;margin-bottom:22px}.modal h2{margin:0;font-size:25px;letter-spacing:-.06em}.modal p{margin:5px 0 0;color:var(--muted);font-size:13px}.template-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.template-card{border:1px solid var(--line);border-radius:15px;overflow:hidden;cursor:pointer;background:#fff;transition:.18s}.template-card:hover{border-color:#aaa1ff;box-shadow:0 12px 22px rgba(65,46,172,.1);transform:translateY(-3px)}.template-preview{height:130px;padding:13px;background:#f4f2ff}.template-preview.t2{background:#fff3e3}.template-preview.t3{background:#e5f7f0}.fake-browser{height:100%;border-radius:8px;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.08);padding:10px}.fake-dots{display:flex;gap:3px}.fake-dots i{width:4px;height:4px;border-radius:50%;background:#d3d0db}.fake-hero{height:46px;border-radius:5px;margin-top:10px;background:linear-gradient(135deg,#d6d0ff,#faf0dd)}.fake-lines{height:5px;border-radius:5px;background:#eeeaf7;margin-top:8px;width:70%}.fake-lines.short{width:45%;margin-top:5px}.template-copy{padding:13px}.template-copy h3{font-size:13px;margin:0 0 4px}.template-copy span{font-size:11px;color:var(--muted)}.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.hidden{display:none!important}.toast{position:fixed;right:24px;bottom:24px;background:var(--ink);color:#fff;padding:13px 17px;border-radius:11px;box-shadow:var(--shadow);font-size:12px;font-weight:750;z-index:80;animation:toast-in .25s ease}.toast small{display:block;color:#bdbbca;font-weight:500;margin-top:4px}@keyframes toast-in{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}
.preview-screen{position:fixed;inset:0;background:#fff;z-index:100;overflow:auto}.preview-bar{height:60px;background:#1c1c32;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:3}.preview-bar .brand{min-width:0}.preview-bar .brand-mark{background:#fff;color:var(--ink)}.preview-bar .brand-label{color:#aaa9bc;border-color:#46465d}.preview-close{border:1px solid #49495f;background:transparent;color:#fff;padding:9px 13px;border-radius:8px;font-size:12px;font-weight:750}.preview-site{max-width:1080px;margin:0 auto;padding-bottom:80px}.preview-site .canvas-block{border:0;cursor:default}.preview-site .block-label,.preview-site .block-hint{display:none}.preview-site .site-nav{padding:0;border-bottom:1px solid var(--line)}
@media(max-width:1100px){.workspace{grid-template-columns:64px 220px minmax(400px,1fr)}.inspector{display:none}.brand{min-width:170px}.site-links{gap:14px}.canvas-scroll{padding:24px 20px 50px}}@media(max-width:760px){.workspace{grid-template-columns:60px 1fr}.left-panel{display:none}.topbar{gap:10px;padding:0 12px}.brand{min-width:0}.brand-label,.save-state,.top-actions .btn:not(.btn-primary){display:none}.canvas-toolbar{padding:0 12px}.canvas-scroll{padding:18px 10px 42px}.site-canvas{border-radius:8px}.hero-block{grid-template-columns:1fr;padding:32px 25px}.hero-art{width:150px;height:150px;margin:25px auto 0}.services-block{padding:28px 24px}.card-grid{grid-template-columns:1fr}.split-block{grid-template-columns:1fr}.split-image{min-height:175px}.split-copy{padding:30px 25px}.cta-block{padding:30px 24px;display:block}.cta-block .hero-button{display:inline-block;margin-top:18px}.site-nav{padding:0 20px}.site-links{display:none}.template-grid{grid-template-columns:1fr 1fr}}
</style>
<style>
.drop-zone{height:10px;margin:0 38px;border:1px dashed transparent;border-radius:8px;transition:.15s ease}.drop-zone span{display:block;height:0;overflow:hidden;opacity:0;text-align:center;font-size:10px;font-weight:750;color:var(--purple)}.drop-zone.drag-over{height:38px;padding:10px;border-color:#a59bff;background:#f3f1ff;color:var(--purple);font-size:10px;text-align:center}.drop-zone.drag-over span{height:auto;opacity:1}.canvas-block.dragging{opacity:.42}.block-drag-handle{position:absolute;top:8px;right:8px;z-index:4;width:28px;height:28px;padding:0;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--purple);font-size:18px;line-height:1;cursor:grab;opacity:0;box-shadow:0 4px 12px rgba(27,24,72,.12)}.canvas-block:hover .block-drag-handle,.canvas-block.selected .block-drag-handle{opacity:1}.block-drag-handle:active{cursor:grabbing}.template-manager-head{display:flex;justify-content:space-between;align-items:start;gap:18px;margin-bottom:24px}.template-section-title{font-size:13px;margin:22px 0 10px;letter-spacing:-.02em}.template-card-manager{cursor:default}.template-card-manager:hover{transform:none}.template-card-manager .template-copy>span:not(.template-badge){display:block;min-height:32px;line-height:1.45}.template-badge{display:inline-block!important;min-height:0!important;color:var(--purple)!important;font-size:9px!important;font-weight:800!important;letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px}.template-card-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}.template-card-actions .btn{padding:7px 9px;font-size:11px}.template-empty{grid-column:1/-1;padding:22px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);font-size:12px}
@media(max-width:760px){.template-manager-head{display:block}.template-manager-head .btn{margin-top:14px}}
</style>

<body>
<div id="app" class="app">
  <header class="topbar"><div class="brand"><div class="brand-mark">n.</div><div class="brand-word">nimble</div><div class="brand-label">Builder</div></div><div class="crumbs"><strong id="workspaceName">Nimble</strong><span>Website builder</span></div><div class="top-actions"><div class="save-state"><i class="save-dot"></i>Saved just now</div><button class="btn btn-icon" id="undoBtn" title="Undo">↶</button><button class="btn btn-icon" id="redoBtn" title="Redo">↷</button><button class="btn" id="templateBtn">Templates</button><button class="btn" id="previewBtn">Preview</button><a class="btn" href="/control-panel">Control panel</a><button class="btn btn-primary" id="publishBtn">Publish</button><div class="avatar" id="userAvatar">PE</div></div></header>
  <div class="workspace">
    <nav class="rail" aria-label="Builder tools"><button class="rail-button active" data-tool="build"><span>▦</span><span>Build</span></button><button class="rail-button" data-tool="pages"><span>▤</span><span>Pages</span></button><button class="rail-button" data-tool="media"><span>▧</span><span>Media</span></button><button class="rail-button" data-tool="styles"><span>◌</span><span>Styles</span></button><button class="rail-button" data-tool="settings"><span>⚙</span><span>Settings</span></button><div class="rail-spacer"></div><button class="rail-button" id="helpBtn"><span>?</span><span>Help</span></button></nav>
    <aside class="panel left-panel" id="leftPanel"></aside>
    <main class="canvas-area"><div class="canvas-toolbar"><div class="crumbs"><span>Page</span><span>›</span><strong id="pageName">Home</strong></div><div class="canvas-tools"><div class="device-switch"><button class="active" data-device="desktop" title="Desktop">▰</button><button data-device="tablet" title="Tablet">▯</button><button data-device="mobile" title="Mobile">▯</button></div><button class="btn btn-icon" id="zoomOut">−</button><span id="zoomLabel" style="font-size:11px;color:#77768a;width:34px;text-align:center">100%</span><button class="btn btn-icon" id="zoomIn">+</button></div></div><div class="canvas-scroll"><div id="siteCanvas" class="site-canvas"></div></div></main>
    <aside class="inspector" id="inspector"></aside>
  </div>
</div>
<div id="modalRoot"></div><div id="toastRoot"></div><input id="fileInput" type="file" accept="image/*,video/*" class="hidden">
<script type="module" src="/assets/builder.js"></script>
